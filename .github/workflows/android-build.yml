name: Android Debug Build

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - 'README.md'
      - 'android/README.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

env:
  GODOT_VERSION: '4.3'
  EXPORT_PRESET: 'Android Debug'
  ARTIFACT_NAME: 'voxel_dungeon_debug.apk'

jobs:
  build-android:
    name: Build & export APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── JDK & Android SDK ──────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;23.2.8568313
            cmdline-tools;latest

      # ── Godot binary + export templates (cached) ───────────────────────
      - name: Cache Godot binary & templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-linux

      - name: Download Godot ${{ env.GODOT_VERSION }} (Linux x86_64)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          wget -q -O godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          ~/godot/godot --version

      - name: Download Godot Android export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          wget -q -O templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      # ── Debug keystore (regenerated each run; debug only) ──────────────
      - name: Generate Android debug keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      # ── Editor settings: tell Godot where SDKs and keystore live ───────
      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "--- editor_settings-4.tres ---"
          cat ~/.config/godot/editor_settings-4.tres

      # ── Install Android build template into res://android/build ───────
      # export_presets.cfg has gradle_build/use_gradle_build=true, which
      # requires the Gradle source template under res://android/build.
      - name: Install Android Gradle build template
        run: |
          rm -rf android/build
          mkdir -p android/build
          unzip -oq ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip -d android/build/
          # marker so Godot doesn't import gradle files as game resources
          touch android/build/.gdignore
          ls android/build/ | head -20

      # ── Cache Gradle for faster subsequent builds ──────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-godot-${{ env.GODOT_VERSION }}
          restore-keys: gradle-godot-

      # ── Import resources (twice; first pass discovers, second confirms) ─
      - name: Import project resources
        run: |
          ~/godot/godot --headless --import 2>&1 | tail -40 || true
          ~/godot/godot --headless --import 2>&1 | tail -40 || true

      # ── Export APK ──────────────────────────────────────────────────────
      - name: Export Android Debug APK
        run: |
          mkdir -p exports
          ~/godot/godot --headless --verbose \
            --export-debug "${EXPORT_PRESET}" \
            "exports/${ARTIFACT_NAME}" 2>&1 | tail -100

      # ── Verify & report ─────────────────────────────────────────────────
      - name: Verify APK
        run: |
          if [ ! -f "exports/${ARTIFACT_NAME}" ]; then
            echo "::error::APK was not produced at exports/${ARTIFACT_NAME}"
            ls -la exports/ || true
            exit 1
          fi
          ls -la exports/
          echo "--- SHA256 ---"
          sha256sum "exports/${ARTIFACT_NAME}"
          echo "--- size ---"
          du -h "exports/${ARTIFACT_NAME}"

      # ── Upload as build artifact (downloadable from Actions tab) ───────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voxel-dungeon-debug-${{ github.sha }}
          path: exports/${{ env.ARTIFACT_NAME }}
          retention-days: 30
          if-no-files-found: error
